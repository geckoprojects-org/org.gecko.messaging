# Mosquitto 2 for the MQTT TCK run: anonymous, plain TCP and WebSocket, and a TLS listener that
# demands a client certificate signed by the CA of the run (docker/brokers.sh makes them).
listener 1883
protocol mqtt
listener 9001
protocol websockets
listener 8883
protocol mqtt
cafile /mosquitto/config/ca.crt
certfile /mosquitto/config/server.crt
keyfile /mosquitto/config/server.key
require_certificate true
allow_anonymous true
persistence false
max_inflight_messages 100
