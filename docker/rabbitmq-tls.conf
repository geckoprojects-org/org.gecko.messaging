# RabbitMQ TLS listener of the AMQP TCK run: demands a client certificate signed by the CA of the
# run (docker/brokers.sh makes them and writes this file into the container).
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/tck-tls/ca.crt
ssl_options.certfile = /etc/rabbitmq/tck-tls/server.crt
ssl_options.keyfile = /etc/rabbitmq/tck-tls/server.key
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true
