# Licence header check, build, unit and OSGi/TCK tests against real brokers — on every branch.
# This is the only place the tests run. Jenkins (see Jenkinsfile) only builds and publishes
# snapshots and releases, which is why there is no snapshot or release workflow here.
#
# Self-contained on purpose. This used to call eclipse-fennec/.github reusable workflows, which
# expect that org's setup and do not fit a repository in geckoprojects-org.
name: CI Build

on:
  push:
    branches:
      - '**'
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the test reports are published as check runs
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads .licenserc.yaml at the repository root (skywalking-eyes format).
      - name: Licence header check
        uses: apache/skywalking-eyes/header@61275cc80d0798a405cb070f7d3a8aaf7cf2c2c1 # v0.8.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      # Handles the Gradle distribution and dependency caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # `build` covers compile, bnd bundle assembly and plain JUnit tests; testOSGi runs the
      # OSGi integration tests and the TCK runners against Mosquitto and RabbitMQ, started by
      # brokerUp (docker/brokers.sh, which also works locally).
      - name: Build, start brokers and run OSGi/TCK tests
        run: ./gradlew build brokerUp testOSGi --no-daemon --stacktrace

      - name: Stop brokers
        if: always()
        run: ./gradlew brokerDown --no-daemon || true

      # renders the JUnit XML as check runs with annotations and a job summary (as in the OSGi
      # spec builds); the TCK report lists every test, grouped by runner, since it is a
      # conformance report
      - name: Unit test report
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: '**/generated/test-reports/test/TEST-*.xml'
          check_name: Unit test results
          require_tests: false

      - name: TCK test report
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: '**/generated/test-reports/testrun.*/TEST-*.xml'
          check_name: TCK results
          require_tests: false
          detailed_summary: true
          include_passed: true
          group_suite: true
          include_time_in_summary: true
          truncate_stack_traces: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            **/generated/test-reports/**/TEST-*.xml
            **/build/test-results/**/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7
