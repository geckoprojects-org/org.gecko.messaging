# bnd 7.4.0: the first bnd that builds the fennec library -pom snapshots again (7.3.0 regression
# in PomResource.doSnapshot) and the version this workspace is verified with on Gradle 9.
bnd_version=7.4.0

# Keep non-bundle folders from being auto-discovered as bnd projects.
# The bnd workspace plugin sweeps all root folders (except dot-folders, buildSrc, gradle)
# into the project graph; 'build' is not in its SPECIAL_FOLDERS, so exclude it explicitly.
# 'spec' holds the specification draft, 'docker' the broker setups of the TCK runs.
bnd_exclude=build,docs,spec,docker

# Gradle 9 runs the configuration cache by default for builds that support it; the bnd
# workspace plugin does not, so keep it off explicitly.
org.gradle.configuration-cache=false

# --- Project coordinates (single source of truth) ---
# Used by Gradle directly and imported into bnd via `-include` in cnf/ext/fennec.bnd.
github_org=geckoprojects-org
github_repository=org.gecko.messaging
maven_group_id=org.geckoprojects.messaging
